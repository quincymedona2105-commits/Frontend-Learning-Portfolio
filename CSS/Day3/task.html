<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>

    <style>

        /* 1. Universal Selector */
        * {
            background-color: white;
        }

        /* 2. Element Selector */
        h1 {
            background-color: green;
            color: white;
            padding: 20px;
        }

        /* 3. Class Selector */
        .student {
            background-color: lightgray;
            color: black;
            padding: 20px;
        }

        /* 4. ID Selector */
        #college {
            background-color: lightgreen;
            color: darkgreen;
            padding: 10px;
        }

        /* 5. Grouping Selector */
        h2, p {
            color: black;
        }

    </style>
</head>

<body>

    <h1>Student Details</h1>

    <div class="student">

        <h2>Personal Information</h2>

        <p>Student Name: Quincy</p>

        <p>Course Name: BCA</p>

        <h2>Education and Skills</h2>

        <p id="college">College Name: Thiruvalluvar University</p>

        <p>Skills: HTML, CSS, JavaScript, Python</p>

    </div>

</body>
</html>
