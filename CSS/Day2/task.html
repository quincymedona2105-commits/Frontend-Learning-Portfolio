<!DOCTYPE html>
<html>
<head>
    <title>CSS Classroom Details</title>

    <style>
        .title {
            color: white;
            background-color: darkblue;
        }

        .section {
            color: black;
            background-color: rgb(128, 210, 237);
        }

        .section-title {
            color: white;
            background-color: blue;
        }

        .teacher {
            color: darkgreen;
            background-color: lightgreen;
        }

        .student {
            color: darkred;
            background-color: pink;
        }

        .topic {
            color: darkblue;
            background-color: lightyellow;
        }

        .status {
            color: white;
            background-color: green;
        }
    </style>
</head>

<body>

    <h1 class="title">CSS Classroom Details</h1>

    <div class="section">
        <h2 class="section-title">CSS Class</h2>
        <p class="teacher">Teacher Name: Mr. Raj</p>
        <p class="teacher">Subject: CSS</p>
    </div>

    <div class="section">
        <h2 class="section-title">Student Information</h2>

        <p class="student">Arun</p>
        <p class="student">Priya</p>
        <p class="student">Kumar</p>
        <p class="student">Divya</p>
    </div>

    <div class="section">
        <h2 class="section-title">Today's Topics</h2>

        <p class="topic">HTML</p>
        <p class="topic">CSS</p>
        <p class="topic">JavaScript</p>
    </div>

    <div class="section">
        <h2 class="section-title">Class Status</h2>

        <p class="status">Class Started</p>
        <p class="status">Class In Progress</p>
        <p class="status">Class Completed</p>
    </div>

</body>
</html>
