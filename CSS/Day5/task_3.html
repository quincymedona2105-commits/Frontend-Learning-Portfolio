<!DOCTYPE html>
<html>

<head>
    <title>Product Card Hover</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-container {
            display: flex;
            gap: 30px;
        }

        .product-card {
            width: 250px;
            background-color: white;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .product-card img {
            width: 200px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h2 {
            margin: 15px 0 10px;
            color: #333;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #01796f;
            margin-bottom: 15px;
        }

        .product-card button {
            padding: 10px 20px;
            border: none;
            background-color: #01796f;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .product-card:hover {
            background-color: #e0f2f1;
            transform: translateY(-10px);
            box-shadow: 0 8px 20px gray;
        }

        .product-card:hover button {
            background-color: #000;
        }
    </style>
</head>

<body>
<!-- QUINCY.DEV PORTFOLIO TASK NAVIGATION BAR -->
<div id="portfolio-task-nav-bar" style="position: sticky; top: 0; left: 0; right: 0; z-index: 99999; background: rgba(3, 20, 18, 0.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(56, 239, 125, 0.35); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
  <a href="../index.html" style="display: inline-flex; align-items: center; gap: 8px; color: #38ef7d; text-decoration: none; font-size: 14px; font-weight: 700; background: rgba(56, 239, 125, 0.12); border: 1px solid rgba(56, 239, 125, 0.4); padding: 8px 18px; border-radius: 9999px; transition: all 0.2s ease;">
    &#8592; Back to CSS Tasks
  </a>
  <span style="font-size: 13px; color: #a3c7b9; font-weight: 600; letter-spacing: 0.5px;">
    QUINCY.DEV &middot; CSS Practice
  </span>
</div>


    <div class="product-container">

        <div class="product-card">
            <img src="./images/laptop.jpg" alt="Laptop">
            <h2>Laptop</h2>
            <p class="price">₹50,000</p>
            <button>View Details</button>
        </div>

        <div class="product-card">
            <img src="./images/headphone.jpg" alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">₹2,500</p>
            <button>View Details</button>
        </div>

        <div class="product-card">
            <img src="./images/watch.jpg" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p class="price">₹3,500</p>
            <button>View Details</button>
        </div>

    </div>

</body>

</html>
