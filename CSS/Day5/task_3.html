<!DOCTYPE html>
<html>

<head>
    <title>Product Card Hover</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-container {
            display: flex;
            gap: 30px;
        }

        .product-card {
            width: 250px;
            background-color: white;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .product-card img {
            width: 200px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h2 {
            margin: 15px 0 10px;
            color: #333;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #01796f;
            margin-bottom: 15px;
        }

        .product-card button {
            padding: 10px 20px;
            border: none;
            background-color: #01796f;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .product-card:hover {
            background-color: #e0f2f1;
            transform: translateY(-10px);
            box-shadow: 0 8px 20px gray;
        }

        .product-card:hover button {
            background-color: #000;
        }
    </style>
</head>

<body>

    <div class="product-container">

        <div class="product-card">
            <img src="./images/laptop.jpg" alt="Laptop">
            <h2>Laptop</h2>
            <p class="price">₹50,000</p>
            <button>View Details</button>
        </div>

        <div class="product-card">
            <img src="./images/headphone.jpg" alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">₹2,500</p>
            <button>View Details</button>
        </div>

        <div class="product-card">
            <img src="./images/watch.jpg" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p class="price">₹3,500</p>
            <button>View Details</button>
        </div>

    </div>

</body>

</html>
