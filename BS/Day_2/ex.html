<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Decathlon Navbar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #111;
        }

        .top-navbar {
            padding: 18px 4%;
            background: white;
        }

        .main-row {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        /* Logo */
        .logo {
            color: #3155c5;
            font-size: 30px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo i {
            font-size: 34px;
            margin-right: 5px;
        }

        /* Search */
        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #555;
        }

        .search-box input {
            width: 100%;
            height: 60px;
            border: none;
            outline: none;
            background: #f5f5f5;
            border-radius: 35px;
            padding: 0 30px 0 80px;
            font-size: 17px;
        }

        /* Right Icons */
        .right-icons {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-icon {
            text-align: center;
            min-width: 55px;
            cursor: pointer;
        }

        .nav-icon i {
            display: block;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .nav-icon span {
            font-size: 15px;
            white-space: nowrap;
        }

        /* Bottom Menu */
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .menu {
            display: flex;
            gap: 45px;
        }

        .menu a {
            color: #111;
            text-decoration: none;
            font-size: 17px;
        }

        .menu a:hover {
            text-decoration: underline;
        }

        .delivery {
            font-size: 16px;
        }

        .delivery strong {
            color: #3155c5;
            font-weight: normal;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .main-row {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
            }

            .search-box {
                order: 2;
                width: 100%;
            }

            .right-icons {
                order: 3;
            }

            .bottom-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
        }

        @media (max-width: 600px) {
            .right-icons {
                width: 100%;
                justify-content: space-between;
                gap: 5px;
            }

            .menu {
                gap: 20px;
                flex-wrap: wrap;
            }

            .delivery {
                display: none;
            }
        }
    </style>
</head>

<body>

<nav class="top-navbar">

    <!-- TOP SECTION -->
    <div class="main-row">

        <!-- Logo -->
        <div class="logo">
            <i class="bi bi-compass-fill"></i>DECATHLON
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <i class="bi bi-search"></i>

            <input 
                type="search" 
                placeholder='Search for "Football Studs"'
            >
        </div>

        <!-- Right Icons -->
        <div class="right-icons">

            <div class="nav-icon">
                <i class="bi bi-person"></i>
                <span>Sign In</span>
            </div>

            <div class="nav-icon">
                <i class="bi bi-shop"></i>
                <span>My Store</span>
            </div>

            <div class="nav-icon">
                <i class="bi bi-question-circle"></i>
                <span>Support</span>
            </div>

            <div class="nav-icon">
                <i class="bi bi-heart"></i>
                <span>Wishlist</span>
            </div>

            <div class="nav-icon">
                <i class="bi bi-bag"></i>
                <span>Cart</span>
            </div>

        </div>

    </div>


    <!-- BOTTOM SECTION -->
    <div class="bottom-row">

        <!-- Menu -->
        <div class="menu">
            <a href="#">All Sports</a>
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
        </div>

        <!-- Delivery -->
        <div class="delivery">
            Delivery to
            <strong>Bangalore Central, Bangalore, 560001, Karnataka</strong>
        </div>

    </div>

</nav>

</body>
</html>
