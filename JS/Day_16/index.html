   <h1>Employee Registration System</h1>

   <form id="employeeForm">
    <label for="employeeName">Employee Name</label>
    <input type="text" id="employeeName" placeholder="Enter your name">
    <br><br><br>

    <label for="employeeAge">Employee Age</label>
    <input type="number" id="employeeAge" placeholder="Enter your age">
    <br><br><br>

    <label for="employeeDepartment">Employee Department</label>
    <input type="text" id="employeeDepartment" placeholder="Enter your department">
    <br><br><br>

    <label for="employeeSalary">Employee Salary</label>
    <input type="number" id="employeeSalary" placeholder="Enter your salary">
    <br><br>

    <button id="addBtn">Submit</button>
</form>

     <h2>Employee Records</h2>
 <div class="table-container">
    <table border ="1" cellpadding="10" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Department</th>
        <th>Salary</th>
    </tr>
    </thead>
    <tbody id="employeeTable"></tbody>
    </table>
</div>
