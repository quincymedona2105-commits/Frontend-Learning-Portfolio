<!DOCTYPE html>
<html>
<head>
    <title>Mini Product Page</title>
</head>
<body>

    <h1>Product Details</h1>

    <div>
        <h2>Laptop</h2>
        <p><strong>Price:</strong> ₹55,000</p>

        <h3>Features</h3>
        <ul>
            <li>16GB RAM</li>
            <li>512GB SSD</li>
            <li>Intel Processor</li>
            <li>15.6-inch Display</li>
        </ul>
    </div>

    <div>
        <h3>Product Specifications</h3>

        <table border="1">
            <tr>
                <th>Specification</th>
                <th>Details</th>
            </tr>
            <tr>
                <td>RAM</td>
                <td>16GB</td>
            </tr>
            <tr>
                <td>Storage</td>
                <td>512GB SSD</td>
            </tr>
            <tr>
                <td>Processor</td>
                <td>Intel Processor</td>
            </tr>
            <tr>
                <td>Display</td>
                <td>15.6-inch</td>
            </tr>
            <tr>
                <td>Price</td>
                <td>₹55,000</td>
            </tr>
        </table>
    </div>

    <div>
        <h3>Order Form</h3>

        <form>
            <label for="name">Customer Name:</label>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1">
            <br><br>

            <label for="address">Address:</label>
            <br>
            <textarea id="address" name="address" rows="5" cols="30"></textarea>
            <br><br>

            <button type="submit">Order</button>
        </form>
    </div>

</body>
</html>
